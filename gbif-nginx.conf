events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream gbif_backend {
    hash $remote_addr consistent;
    server gbif-shiny-app-1:3838 max_fails=1 fail_timeout=5s;
    server gbif-shiny-app-2:3838 max_fails=1 fail_timeout=5s;
    server gbif-shiny-app-3:3838 max_fails=1 fail_timeout=5s;
  }

  server {
    listen 8080;
    server_name gbif.glatar.org;

    client_max_body_size 20M;

    location / {
      proxy_pass http://gbif_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }
  }
}