services:
  gbif-nginx:
    image: nginx:latest
    restart: unless-stopped
    volumes:
      - ./gbif-nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - gbif-net
      - edge-net   
    depends_on:
      - gbif-app

  gbif-app:
    image: ghcr.io/benjaminhlina/gbif-app:latest
    restart: unless-stopped
    expose:
      - "3838"
    networks:
      - gbif-net

networks:
  gbif-net:
    driver: bridge
  edge-net:
    external: true