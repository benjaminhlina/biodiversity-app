name: Deploy Docker Compose to DO

on:
  workflow_run:
    workflows: ["R CMD Check and Build Docker Image"]
    types:
      - completed
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with Docker Compose     
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |      
          # Ensure destination folder exists on server
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} "mkdir -p /opt/gbif"

          # Copy configuration files
          scp -i ~/.ssh/deploy_key ./gbif-nginx.conf ${SERVER_USER}@${SERVER_HOST}:/opt/gbif/gbif-nginx.conf
          scp -i ~/.ssh/deploy_key ./docker-compose.yaml ${SERVER_USER}@${SERVER_HOST}:/opt/gbif/docker-compose.yaml
          
          # Run deployment commands on remote server
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} << EOF
          set -e
          cd /opt/gbif
          
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u benjaminhlina --password-stdin

          docker compose pull
          docker compose down --remove-orphans
          
          # Scale gbif-app service specifically
          docker compose up -d --scale gbif-app=3

          docker image prune -f
          docker compose ps
          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/deploy_key